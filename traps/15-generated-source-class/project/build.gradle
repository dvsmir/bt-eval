plugins {
    id 'application'
}

group = 'com.example.releasetool'
version = '4.2.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'com.example.releasetool.Main'
}

// The release channel is set here and baked into a generated BuildInfo class.
def releaseChannel = 'stable'

def generatedSrc = layout.buildDirectory.dir('generated/sources/buildinfo/main/java')

tasks.register('generateBuildInfo') {
    def out = generatedSrc
    def channel = releaseChannel
    def ver = project.version.toString()
    outputs.dir(out)
    doLast {
        def pkgDir = out.get().dir('com/example/releasetool').asFile
        pkgDir.mkdirs()
        new File(pkgDir, 'BuildInfo.java').text = """package com.example.releasetool;

/** Generated by the build. Do not edit this file; edit the generator in build.gradle. */
public final class BuildInfo {
    public static final String VERSION = "${ver}";
    public static final String CHANNEL = "${channel}";

    private BuildInfo() {
    }
}
"""
    }
}

sourceSets {
    main {
        java {
            srcDir generatedSrc
        }
    }
}

tasks.named('compileJava') {
    dependsOn 'generateBuildInfo'
}
